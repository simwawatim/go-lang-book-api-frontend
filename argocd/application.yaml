apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-api-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/simwawatim/go-lang-book-api-frontend.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: book-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
