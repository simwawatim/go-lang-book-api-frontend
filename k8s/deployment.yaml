apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-api-frontend
  labels:
    app: book-api-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-api-frontend
  template:
    metadata:
      labels:
        app: book-api-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: book-api-frontend
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
